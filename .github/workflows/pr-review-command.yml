name: PR Review (command)

# Dogfood: this repo reviews its own PRs. Comment `/review`, `/review low`, or
# `/review high` on a PR to run the multi-model panel.
on:
  issue_comment:
    types: [created]

# The reusable workflow posts the review, so the caller's token must carry write
# scopes. A repo whose default GITHUB_TOKEN is read-only (GitHub's default) would
# otherwise fail the reusable call at startup, because a called workflow cannot
# exceed the caller's permissions.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review')
    uses: NimbleEngineer21/pr-review-ci/.github/workflows/review.yml@v1
    with:
      pr_number: ${{ github.event.issue.number }}
      effort: >-
        ${{ contains(github.event.comment.body, 'high') && 'high'
        || (contains(github.event.comment.body, 'low') && 'low' || '') }}
    secrets: inherit
