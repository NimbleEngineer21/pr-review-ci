name: PR Review (label)

# Dogfood: add the label `ai-review` (auto effort) or `ai-review-deep` (high) to
# a PR in this repo to run the multi-model panel.
on:
  pull_request:
    types: [labeled]

# See pr-review-command.yml: the caller must grant write scopes so the reusable
# workflow it calls can post the review (a called workflow cannot exceed the
# caller's token permissions).
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event.label.name == 'ai-review' ||
      github.event.label.name == 'ai-review-deep'
    uses: NimbleEngineer21/pr-review-ci/.github/workflows/review.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      effort: ${{ github.event.label.name == 'ai-review-deep' && 'high' || '' }}
    secrets: inherit
